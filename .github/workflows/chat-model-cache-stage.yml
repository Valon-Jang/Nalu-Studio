name: Chat Luna Model Cache Stage

on:
  push:
    branches: [chat-model-cache-stage]
    paths:
      - '.github/workflows/chat-model-cache-stage.yml'

permissions:
  contents: read

env:
  REVISION: '5bb1f6ee58e50c3b8d408bc82a6d3740c2db6e18'
  BASE: 'https://huggingface.co/ResembleAI/chatterbox/resolve/5bb1f6ee58e50c3b8d408bc82a6d3740c2db6e18'

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Download and verify T3 V3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          curl -L --fail --retry 5 --retry-all-errors --connect-timeout 30 \
            "$BASE/t3_mtl23ls_v3.safetensors?download=true" \
            -o out/t3_mtl23ls_v3.safetensors
          test "$(stat -c%s out/t3_mtl23ls_v3.safetensors)" = "2143989928"
          echo '5abca8321ede76f8e61f1cc0d19aea6c946b28871017ce8726f8a69203f05953  out/t3_mtl23ls_v3.safetensors' | sha256sum -c -
          split -b 200000000 -d -a 2 out/t3_mtl23ls_v3.safetensors out/t3.part

      - uses: actions/upload-artifact@v4
        with: {name: luna-t3-part00, path: out/t3.part00, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: luna-t3-part01, path: out/t3.part01, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: luna-t3-part02, path: out/t3.part02, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: luna-t3-part03, path: out/t3.part03, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: luna-t3-part04, path: out/t3.part04, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: luna-t3-part05, path: out/t3.part05, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: luna-t3-part06, path: out/t3.part06, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: luna-t3-part07, path: out/t3.part07, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: luna-t3-part08, path: out/t3.part08, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: luna-t3-part09, path: out/t3.part09, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: luna-t3-part10, path: out/t3.part10, compression-level: 0, retention-days: 1}

      - name: Clear T3 staging
        run: rm -f out/t3_mtl23ls_v3.safetensors out/t3.part*

      - name: Download and verify S3Gen
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-all-errors --connect-timeout 30 \
            "$BASE/s3gen.pt?download=true" \
            -o out/s3gen.pt
          test "$(stat -c%s out/s3gen.pt)" = "1057165844"
          echo '9b9ff07e60b20c136e2b1b3d7563a24604e8d2c4c267888d1ee929dd0151d2a3  out/s3gen.pt' | sha256sum -c -
          split -b 200000000 -d -a 2 out/s3gen.pt out/s3.part

      - uses: actions/upload-artifact@v4
        with: {name: luna-s3-part00, path: out/s3.part00, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: luna-s3-part01, path: out/s3.part01, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: luna-s3-part02, path: out/s3.part02, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: luna-s3-part03, path: out/s3.part03, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: luna-s3-part04, path: out/s3.part04, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: luna-s3-part05, path: out/s3.part05, compression-level: 0, retention-days: 1}

      - name: Clear S3Gen staging
        run: rm -f out/s3gen.pt out/s3.part*

      - name: Download and verify small model assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request
          base='https://huggingface.co/ResembleAI/chatterbox/resolve/5bb1f6ee58e50c3b8d408bc82a6d3740c2db6e18'
          for name in ['ve.pt','conds.pt','grapheme_mtl_merged_expanded_v1.json','Cangjie5_TC.json']:
              urllib.request.urlretrieve(f'{base}/{name}?download=true', f'out/{name}')
          PY
          test "$(stat -c%s out/ve.pt)" = "5698626"
          test "$(stat -c%s out/conds.pt)" = "107374"
          test "$(stat -c%s out/grapheme_mtl_merged_expanded_v1.json)" = "69989"
          test "$(stat -c%s out/Cangjie5_TC.json)" = "1920163"
          echo '4b16d836bc598509860f6fa068165a8bb5e9ac84f05582dfcf278a5a372879f1  out/ve.pt' | sha256sum -c -
          echo '6552d70568833628ba019c6b03459e77fe71ca197d5c560cef9411bee9d87f4e  out/conds.pt' | sha256sum -c -
          echo '69632f47220a788a52ce2661d096453c5655e9bf25289d89a8d832c46ee07dbf  out/grapheme_mtl_merged_expanded_v1.json' | sha256sum -c -
          echo '7073fd9de919443ae88e0bd2449917a65fe54898a4413ed1edcc4b67f28bce8c  out/Cangjie5_TC.json' | sha256sum -c -

      - name: Upload small model assets
        uses: actions/upload-artifact@v4
        with:
          name: luna-model-small
          path: |
            out/ve.pt
            out/conds.pt
            out/grapheme_mtl_merged_expanded_v1.json
            out/Cangjie5_TC.json
          compression-level: 0
          retention-days: 1
