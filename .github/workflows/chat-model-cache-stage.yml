name: Chat Luna Model Cache Stage

on:
  push:
    branches: [chat-model-cache-stage]
    paths:
      - '.github/workflows/chat-model-cache-stage.yml'

permissions:
  contents: read

env:
  HF_HUB_DISABLE_XET: '1'
  REVISION: '5bb1f6ee58e50c3b8d408bc82a6d3740c2db6e18'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download exact small model asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import urllib.request
          rev='5bb1f6ee58e50c3b8d408bc82a6d3740c2db6e18'
          name='Cangjie5_TC.json'
          url=f'https://huggingface.co/ResembleAI/chatterbox/resolve/{rev}/{name}?download=true'
          urllib.request.urlretrieve(url, f'out/{name}')
          PY
          test "$(stat -c%s out/Cangjie5_TC.json)" = "1920163"
          echo '7073fd9de919443ae88e0bd2449917a65fe54898a4413ed1edcc4b67f28bce8c  out/Cangjie5_TC.json' | sha256sum -c -
      - name: Upload probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: luna-model-probe
          path: out/Cangjie5_TC.json
          compression-level: 0
          retention-days: 1
