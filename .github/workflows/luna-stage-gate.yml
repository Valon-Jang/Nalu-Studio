name: luna-stage-gate

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  verify-stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify signed stage state and protected files
        env:
          LUNA_STAGE_GATE_KEY: ${{ secrets.LUNA_STAGE_GATE_KEY }}
        run: python tools/stage_gate.py verify --require-signature

      - name: Enforce current-stage path scope
        run: python tools/stage_gate.py check-scope
